# demo
demo_path: "demos/demo.hdf5"
demo_names: ["demo_1", "demo_2"]

# GPU
use_gpu: True

# sampling                  
sampler: "BasicSampler"
sampling_forward: True
sampling_interval: 500
num_branches: 5                                       # number of samples to generate at each depth
num_steps_per_branch: 15

control_angle_goal: 15
control_angle_start: 45
control_angle_mid: 85


# dataset
data_dir: "data"
split_ratio: 0.5

# observation dims
ft_window_size: 32                                     # number of frame to concatenate into one observation
ft_dim: 6
action_dim: 7
proprio_dim: 32
image_dim: 128

# network architecture
sensors: ["ft", "image", "proprio"]                 # must have: "ft" , can have: "image", "proprio".
architecture: 3
ft_network_type: "MLP"                                # choose one: "MLP" / "LSTM"
z_dim: 64                                             # try 48
use_action_in_delta: True

# training
initialize_weights: True
batch_size: 64
num_workers: 0
lr: 0.0003
weight_decay: 0.000005
num_iters: 1000000
log_freq: 1           # 200
save_freq: 1          # 200

# loss
reconstruction_lambda: 0.2
temporal_enforcement_lambda: 10.0

